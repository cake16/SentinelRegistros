<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 60px; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); width: 100%; max-width: 380px; }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 24px; font-size: .9rem; }
    label { display: block; font-size: .85rem; margin-bottom: 6px; color: #333; }
    input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .flash { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Crea tu registro</h1>
    <p class="sub">Te enviaremos un correo para confirmar tu registro.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('registrar') }}" method="post">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" name="nombre" required>
      <label for="empresa">Empresa</label>
      <input type="text" id="empresa" name="empresa" required>
      <label for="telefono">Número de Telefono</label>
      <input type="text" id="telefono" name="telefono" required>
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <button type="submit">Registrarme</button>
    </form>
  </div>
</body>
</html>
