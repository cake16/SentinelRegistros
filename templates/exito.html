<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro exitoso</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 60px; text-align: center; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); width: 100%; max-width: 380px; }
    .icon { font-size: 2.5rem; margin-bottom: 8px; }
    h1 { font-size: 1.3rem; color: #15803d; }
    p { color: #555; font-size: .95rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    {% if ya_confirmado %}
      <h1>Este correo ya estaba confirmado</h1>
      <p>Hola {{ nombre }}, tu registro ya se había completado anteriormente.</p>
    {% else %}
      <h1>¡Registro exitoso!</h1>
      <p>Gracias {{ nombre }}, tu correo fue confirmado correctamente.</p>
    {% endif %}
  </div>
</body>
</html>
